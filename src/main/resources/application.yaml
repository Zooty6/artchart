spring:
  application:
    name: artcharts
  servlet:
    multipart:
      max-file-size: ${ARTCHART_FILE_UPLOAD_LIMIT:100MB}
      max-request-size: ${ARTCHART_FILE_UPLOAD_LIMIT:100MB}
  datasource:
    url: ${ARTCHART_DATASOURCE_URL}
    driver-class-name: org.sqlite.JDBC
    dbcp2:
      default-read-only: true
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    open-in-view: false

springdoc:
  api-docs:
    path: /apidocs
  swagger-ui:
    path: /swagger

artcharts:
  currencyapi:
    apiKey: ${ARTCHART_CURRENCYAPI_APIKEY}
    cache-ttl: PT3H
  media-root: ${ARTCHART_MEDIA_ROOT:.}
  self:
    name: ${ARTCHART_SELF_NAME:Zooty}
