server:
  port: ${ARTCHART_SERVER_PORT:8080}

spring:
  ai:
    mcp:
      server:
        enabled: ${ARTCHART_MCP_ENABLED:false}
        protocol: STATELESS
        name: artchart
        capabilities:
          resource: false
          prompt: false
          completion: false
        annotation-scanner:
          enabled: false
  application:
    name: artcharts
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${ARTCHART_FILE_UPLOAD_LIMIT:100MB}
      max-request-size: ${ARTCHART_FILE_UPLOAD_LIMIT:100MB}
  datasource:
    url: ${ARTCHART_DATASOURCE_URL}
    driver-class-name: org.sqlite.JDBC
    dbcp2:
      default-read-only: true
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    open-in-view: false

springdoc:
  api-docs:
    path: /apidocs
  swagger-ui:
    path: /swagger

artcharts:
  mcp:
    public-base-url: ${ARTCHART_MCP_PUBLIC_BASE_URL:}
  currencyapi:
    apiKey: ${ARTCHART_CURRENCYAPI_APIKEY}
    cache-ttl: PT3H
  media-root: ${ARTCHART_MEDIA_ROOT:.}
  media-cache-max-age-seconds: ${ARTCHART_MEDIA_CACHE_MAX_AGE_SECONDS:31536000}
  self:
    name: ${ARTCHART_SELF_NAME:Zooty}
