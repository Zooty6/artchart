<th:block th:fragment="fields" xmlns:th="http://www.thymeleaf.org">

    <label>FurAffinity <input th:field="*{furaffinity}"></label>
    <label>Twitter <input th:field="*{twitter}"></label>
    <label>Discord <input th:field="*{discord}"></label>
    <label>DeviantArt <input th:field="*{deviantart}"></label>
    <label>PayPal email <input type="email" th:field="*{paypalEmail}"></label>
    <label>Site <input th:field="*{site}"></label>
    <label>Boosty <input th:field="*{boosty}"></label>
    <label>Telegram <input th:field="*{telegram}"></label>
    <label>Facebook <input th:field="*{facebook}"></label>
    <label>VGen <input th:field="*{vgen}"></label>
    <label class="full-width">Note <textarea th:field="*{note}"></textarea></label>
