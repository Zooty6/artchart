<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New artist - ArtCharts</title>
    <link rel="stylesheet" href="/site/site.css">
    <script src="/webjars/htmx.org/2.0.0/dist/htmx.min.js" defer></script>
</head>
<body>
<header th:replace="~{site/fragments/navigation :: navigation}"></header>
<main>
    <h1>New artist</h1>
    <form th:action="@{/site/artists}" th:object="${artist}" method="post" class="form-grid">
        <div th:replace="~{site/fragments/artist-fields :: fields}"></div>
        <button type="submit">Save artist</button>
    </form>
</main>
</body>
</html>
