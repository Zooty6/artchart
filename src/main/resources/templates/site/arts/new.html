<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New art - ArtCharts</title>
    <link rel="stylesheet" href="/site/site.css">
    <script src="/webjars/htmx.org/4.0.0/dist/htmx.min.js" defer></script>
</head>
<body class="art-form-page">
<header th:replace="~{site/fragments/navigation :: navigation}"></header>
<main>
    <h1>New art</h1>
    <form th:action="@{/site/arts}" th:object="${art}" method="post" enctype="multipart/form-data" class="form-grid">
        <label>Artist name *
            <input th:field="*{artistName}" list="artist-suggestions" autocomplete="off"
                   hx-get="/site/artists/search" hx-trigger="input changed delay:250ms"
                   hx-target="#artist-suggestions" hx-swap="innerHTML">
            <datalist id="artist-suggestions"></datalist>
            <small class="error" th:errors="*{artistName}"></small>
        </label>
        <label>Type *
            <input th:field="*{type}" list="type-suggestions" autocomplete="off" required
                   hx-get="/site/arts/suggestions/type" hx-trigger="input changed delay:250ms"
                   hx-target="#type-suggestions" hx-swap="innerHTML">
            <datalist id="type-suggestions"></datalist>
            <small class="error" th:errors="*{type}"></small>
        </label>
        <label>Species *
            <input th:field="*{species}" list="species-suggestions" autocomplete="off" required
                   hx-get="/site/arts/suggestions/species" hx-trigger="input changed delay:250ms"
                   hx-target="#species-suggestions" hx-swap="innerHTML">
            <datalist id="species-suggestions"></datalist>
            <small class="error" th:errors="*{species}"></small>
        </label>
        <label>Quality
            <input th:field="*{quality}" list="quality-suggestions" autocomplete="off"
                   hx-get="/site/arts/suggestions/quality" hx-trigger="input changed delay:250ms"
                   hx-target="#quality-suggestions" hx-swap="innerHTML">
            <datalist id="quality-suggestions"></datalist>
        </label>
        <label>Ordered date <input type="date" th:field="*{orderedDate}"></label>
        <label>Paid date <input type="date" th:field="*{payedDate}"></label>
        <div class="form-field">
            <label for="fileName">File name *</label>
            <span class="file-name-control">
                <input id="fileName" th:field="*{fileName}" required>
                <label for="artFile" class="file-upload-button" title="Choose art file" aria-label="Choose art file">📎</label>
                <input id="artFile" name="file" type="file" class="file-upload-input"
                       aria-label="Choose art file">
            </span>
            <small class="error" th:errors="*{fileName}"></small>
        </div>
        <label>Delivered date * <input type="date" th:field="*{deliveredDate}" required><small class="error"
                                                                                               th:errors="*{deliveredDate}"></small></label>
        <label>Currency
            <select th:field="*{currency}">
                <option th:each="currency : ${currencies}" th:value="${currency}" th:text="${currency}">USD</option>
            </select>
        </label>
        <label>Amount <input type="number" step="0.01" th:field="*{amount}"></label>
        <label>Link <input type="url" th:field="*{link}"></label>
        <label class="checkbox"><input type="checkbox" th:field="*{isNsfw}"> NSFW</label>
        <label class="full-width">Other characters <textarea th:field="*{otherCharacters}"></textarea></label>
        <label class="full-width">Note <textarea th:field="*{note}"></textarea></label>
        <button type="submit">Save art</button>
    </form>
<script>
    const artFile = document.getElementById('artFile');
    const fileName = document.getElementById('fileName');
    const page = document.body;
    let dragDepth = 0;

    artFile.addEventListener('change', function () {
        if (this.files.length > 0) {
            fileName.value = this.files[0].name;
        }
    });

    page.addEventListener('dragenter', function (event) {
        event.preventDefault();
        dragDepth++;
        page.classList.add('drag-over');
    });

    page.addEventListener('dragover', function (event) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
    });

    page.addEventListener('dragleave', function (event) {
        event.preventDefault();
        dragDepth--;
        if (dragDepth <= 0) {
            dragDepth = 0;
            page.classList.remove('drag-over');
        }
    });

    page.addEventListener('drop', function (event) {
        event.preventDefault();
        dragDepth = 0;
        page.classList.remove('drag-over');

        if (event.dataTransfer.files.length > 0) {
            artFile.files = event.dataTransfer.files;
            artFile.dispatchEvent(new Event('change', { bubbles: true }));
        }
    });
</script>
</main>
</body>
</html>
