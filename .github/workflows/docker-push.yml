name: Publish Docker image

on:
  push:
    branches:
      - master

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      pull-requests: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read version from pom.xml
        id: project_version
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          chmod +x mvnw
          version=$(./mvnw -q help:evaluate \
            -Dexpression=project.version \
            -DforceStdout)

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release version: $version"
            exit 1
          fi

          release_type=patch
          detect_release_type() {
              local text="${1,,}"
              local found=""
              local marker type

              for marker in "skip release" "minor release" "major release"; do
                if [[ "$text" == *"$marker"* ]]; then
                  case "$marker" in
                    "skip release") type=skip ;;
                    "minor release") type=minor ;;
                    "major release") type=major ;;
                  esac
                  if [[ -n "$found" && "$found" != "$type" ]]; then
                    echo "Conflicting release directives found in the same text." >&2
                    return 1
                  fi
                  found="$type"
                fi
              done
              printf '%s' "$found"
          }

          commit_type=$(detect_release_type "$COMMIT_MESSAGE")
          pull_request_titles=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/commits/$COMMIT_SHA/pulls" \
            --jq '[.[].title] | join("\n")')
          pull_request_type=$(detect_release_type "$pull_request_titles")

          if [[ -n "$pull_request_type" ]]; then
            release_type="$pull_request_type"
          elif [[ -n "$commit_type" ]]; then
            release_type="$commit_type"
          fi

          if [[ "$release_type" == "skip" ]]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "$version"
          case "$release_type" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac

          ./mvnw -q versions:set -DnewVersion="$version" -DgenerateBackupPoms=false
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Image version: $version"
          
      - name: Extract metadata
        id: meta
        if: ${{ steps.project_version.outputs.skip != 'true' }}
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.project_version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        if: ${{ steps.project_version.outputs.skip != 'true' }}
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        if: ${{ steps.project_version.outputs.skip != 'true' }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
